<ion-content>

  <h1>Tarea</h1>
  <h2>Crea y gestiona tus tareas</h2>

  <main>

    <section id="resumen">

      <div id="tareas">
        ✓ {{ tareasCompletadas }} Completadas
      </div>

      <div id="pendientes">
        {{ tareasPendientes }} Pendientes
      </div>

      <div id="completadas">
        {{ tareasCompletadas }} Completadas
      </div>

    </section>

    <!-- FILTROS -->
    <section id="filtros">
      <div id="todas">Todas</div>
      <div id="pendientes">Pendientes</div>
      <div id="completadas">Completadas</div>
      <div id="vencidas">Vencidas</div>
    </section>

    <button (click)="mostrarFormulario = true">
      ➕ Agregar tarea</button>

    <!-- FORMULARIO CREAR TAREA -->
    <section id="crear-tarea" *ngIf="mostrarFormulario">

      <input type="text" placeholder="Nombre de la tarea" [(ngModel)]="nuevoNombre">

      <input type="text" placeholder="Categoría" [(ngModel)]="nuevaCategoria">


      <select [(ngModel)]="nuevaPrioridad">
        <option *ngFor="let prioridad of prioridadesDisponibles" [value]="prioridad">
          {{ prioridad }}
        </option>
      </select>

      <button (click)="agregarTask()">
        Agregar tarea
      </button>

      <button (click)="mostrarFormulario = false">
        Cancelar
      </button>

    </section>

    <!-- LISTA DE TAREAS -->
    <section id="tareas">

      <div class="tarea" *ngFor="let task of tasks">

        <input type="checkbox" [(ngModel)]="task.completada" (change)="cambiarEstado(task)">

        <div class="informacion-tarea">

          <span class="nombre-tarea">
            {{ task.name }}
          </span>

          <div class="detalles-tarea">

            <span class="fecha">
              📅 {{ task.date | date:'dd/MM/yyyy' }}
            </span>

            <span class="categoria">
              🏷 {{ task.categoria }}
            </span>

            <button type="button" (click)="editarTask(task)">
              Editar tarea
            </button>

            <span class="prioridad">
              {{ task.prioridad }}
            </span>

            <button class="btn-eliminar" (click)="eliminarTask(task.id)">
              🗑
            </button>

          </div>
        </div>
      </div>
    </section>

    <div class="modal" *ngIf="editando && taskEditando">

      <div class="modal-content">

        <!-- <h2>Editar tarea</h2> -->
        <button class="editar-cerrar" (click)="editando = false">✖</button>

        <div class="form-group">
          <label>Nombre</label>
          <input type="text" [(ngModel)]="taskEditando!.name">
        </div>

        <div class="form-group">
          <label>Categoría</label>
          <input type="text" [(ngModel)]="taskEditando!.categoria">
        </div>

        <div class="form-group">
          <label>Prioridad</label>
          <select [(ngModel)]="taskEditando!.prioridad">
            <option *ngFor="let prioridad of prioridadesDisponibles" [value]="prioridad">
              {{ prioridad }}
            </option>
          </select>
        </div>

        <div class="botones">
          <button class="guardar" (click)="guardarEdicion()">Guardar</button>
          <button class="cancelar" (click)="editando = false">Cancelar</button>
        </div>

      </div>

    </div>

  </main>

  <app-bottom-navigation></app-bottom-navigation>

</ion-content>
